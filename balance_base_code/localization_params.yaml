map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom_combined"
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    recover_alpha_fast: 0.0
    recover_alpha_slow: 0.0
    scan_topic: /scan
    set_initial_pose: true # Automatically initialize at the origin on startup
    initial_pose: [0.0, 0.0, 0.0]
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05